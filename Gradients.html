<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Gradients</title> 
</head>

<style>
  body { background: rgb(221, 216, 216) }
  .tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; margin-top: 1rem; }
  .tbl th { text-align: left; padding: 8px 12px; color: var(--text-muted); font-weight: 500; border-bottom: 0.5px solid var(--border); font-size: 12px; }
  .tbl td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .swatch { width: 100%; height: 44px; border-radius: 6px; border: 3px solid #000; box-sizing: border-box; }
  .paired-swatch { width: 100%; height: 44px; border-radius: 6px; overflow: hidden; display: flex; border: 3px solid #000; box-sizing: border-box; }
  .pair-block { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-transform: capitalize; padding: 0 6px; line-height: 1.1; }
  .name { font-weight: 500; color: var(--text-primary); font-size: 13px; }
  .vibe { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .hexes { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); line-height: 1.7; }
  .copy-btn { font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-secondary); white-space: nowrap; }
  .copy-btn:active { transform: scale(0.96); }
  .section-row td { background: var(--surface-1); font-size: 11px; font-weight: 500; color: var(--text-muted); padding: 6px 12px; letter-spacing: 0.05em; text-transform: uppercase; }
  th:nth-child(1) { width: 18%; }
  th:nth-child(2) { width: 20%; }
  th:nth-child(3) { width: 42%; }
  th:nth-child(4) { width: 12%; }
  th:nth-child(5) { width: 8%; }
</style>

<body>
<table class="tbl">
  <thead>
    <tr>
      <th>Preview</th>
      <th>Name</th>
      <th>Hex codes</th>
      <th>Direction</th>
      <th>Copy</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const sections = [
  {
    label: "Yellow-pink inspired",
    items: [
      { name: "Sunset punch",    vibe: "Yellow · pink",           stops: ["#FFE135","#FF6B9D"],           dir: "to right" },
      { name: "Mango flamingo",  vibe: "Amber · deep pink",       stops: ["#FFCF40","#FF4E8C"],           dir: "to right" },
      { name: "Peach aurora",    vibe: "Gold · blush · magenta",  stops: ["#FFD580","#FF85A1","#D94FBF"], dir: "to right" },
      { name: "Citrus rose",     vibe: "Lemon · rose",            stops: ["#F9F047","#FF6EB4"],           dir: "to right" },
      { name: "Golden magenta",  vibe: "Gold · electric purple",  stops: ["#FFC200","#E040FB"],           dir: "to right" },
      { name: "Tropical blush",  vibe: "Yellow · peach · pink",   stops: ["#FFE066","#FFA07A","#FF69B4"], dir: "to right" },
    ]
  },
  {
    label: "Diverse colour families",
    items: [
      { name: "Ocean to sky",    vibe: "Blue · teal",             stops: ["#0EA5E9","#06EE9E"],           dir: "to right" },
      { name: "Purple haze",     vibe: "Violet · blue",           stops: ["#7C3AED","#3B82F6"],           dir: "to right" },
      { name: "Emerald dusk",    vibe: "Green · indigo",          stops: ["#10B981","#6366F1"],           dir: "to right" },
      { name: "Candy aurora",    vibe: "Mint · purple · pink",    stops: ["#67E8F9","#A855F7","#EC4899"], dir: "to right" },
      { name: "Fire ember",      vibe: "Red · orange · amber",    stops: ["#EF4444","#F97316","#FBBF24"], dir: "to right" },
      { name: "Midnight bloom",  vibe: "Deep navy · violet",      stops: ["#1E1B4B","#7C3AED"],           dir: "to right" },
      { name: "Forest to lime",  vibe: "Deep green · lime",       stops: ["#064E3B","#A3E635"],           dir: "to right" },
      { name: "Rose gold dream", vibe: "Blush · gold · peach",    stops: ["#FBCFE8","#FDE68A","#FCA5A5"], dir: "to right" },
      { name: "Cyber neon",      vibe: "Hot pink · electric blue",stops: ["#F0047F","#0AEFFF"],           dir: "to right" },
      { name: "Lavender cloud",  vibe: "Soft purple · sky blue",  stops: ["#C4B5FD","#BAE6FD"],           dir: "to right" },
    ]
  },
  {
    label: "Paired colors",
    items: [
      { name: "Butter + Green",     vibe: "Butter · Green",      stops: ["#ffefb3","#013e37"], dir: "to right", pair: true, labels: ["Butter","Green"] },
      { name: "Cream vanilla + Cherry cola", vibe: "Cream vanilla · Cherry cola", stops: ["#efe6dd","#9a0002"], dir: "to right", pair: true, labels: ["Cream vanilla","Cherry cola"] },
      { name: "Aureolin + Bistre",  vibe: "Aureolin · Bistre",    stops: ["#fbe311","#261606"], dir: "to right", pair: true, labels: ["Aureolin","Bistre"] },
      { name: "Lime green + Vibrant Red", vibe: "Lime green · Vibrant red", stops: ["#d3f00a","#f9100c"], dir: "to right", pair: true, labels: ["Lime green","Vibrant red"] },
      { name: "Violet + Imperial Red", vibe: "Violet · Imperial red", stops: ["#321847","#f15153"], dir: "to right", pair: true, labels: ["Violet","Imperial red"] },
      { name: "Magenta + Yellow", vibe: "Magenta · Yellow", stops: ["#ff006e","#ffd60a"], dir: "to right", pair: true, labels: ["Magenta","Yellow"] },
      { name: "Ocean + Lemonade", vibe: "Ocean · Lemonade", stops: ["#1e45fc","#cdf12b"], dir: "to right", pair: true, labels: ["Ocean","Lemonade"] },
      { name: "Sunburst + Mocha", vibe: "Sunburst · Mocha", stops: ["#ffa602","#432c1c"], dir: "to right", pair: true, labels: ["Sunburst","Mocha"] },
      { name: "Teal + Mimosa", vibe: "Teal · Mimosa", stops: ["#00555a","#ffc94b"], dir: "to right", pair: true, labels: ["Teal","Mimosa"] },
      { name: "Plum wine + Linen cloud", vibe: "Plum wine · Linen cloud", stops: ["#5e4074","#f7f9ec"], dir: "to right", pair: true, labels: ["Plum wine","Linen cloud"] },
      { name: "Chartreuse + Gun Metal", vibe: "Chartreuse · Gun Metal", stops: ["#e1ff51","#00272c"], dir: "to right", pair: true, labels: ["Chartreuse","Gun Metal"] },
      { name: "Maroon + Xanthous", vibe: "Maroon · Xanthous", stops: ["#780115","#f7b638"], dir: "to right", pair: true, labels: ["Maroon","Xanthous"] },
      { name: "Buttermilk + Mid Blue", vibe: "Buttermilk · Mid Blue", stops: ["#fff2bd","#285ccc"], dir: "to right", pair: true, labels: ["Buttermilk","Mid Blue"] },
      { name: "Lavender + Velvet", vibe: "Lavender · Velvet", stops: ["#d3c5f6","#3b2a60"], dir: "to right", pair: true, labels: ["Lavender","Velvet"] },
      { name: "Salmon + Mid Green", vibe: "Salmon · Mid Green", stops: ["#ff947a","#025259"], dir: "to right", pair: true, labels: ["Salmon","Mid Green"] },
      { name: "Jet black + Orchid", vibe: "Jet black · Orchid", stops: ["#1D1D1D","#E5BDDF"], dir: "to right", pair: true, labels: ["Jet black","Orchid"] },
      { name: "Wine Ash + Turquoise", vibe: "Wine Ash · Turquoise", stops: ["#32292f","#99E1D9"], dir: "to right", pair: true, labels: ["Wine Ash","Turquoise"] }
    ]
  }
];

const tbody = document.getElementById('tbody');

sections.forEach(sec => {
  const secRow = document.createElement('tr');
  secRow.className = 'section-row';
  secRow.innerHTML = `<td colspan="5">${sec.label}</td>`;
  tbody.appendChild(secRow);

  sec.items.forEach(p => {
    const css = p.pair && p.stops.length === 2
      ? `linear-gradient(${p.dir}, ${p.stops[0]} 0%, ${p.stops[0]} 50%, ${p.stops[1]} 50%, ${p.stops[1]} 100%)`
      : `linear-gradient(${p.dir}, ${p.stops.join(', ')})`;
    const previewHtml = p.pair && p.stops.length === 2
      ? `<div class="paired-swatch">
           <div class="pair-block" style="background:${p.stops[0]};color:${p.stops[1]};">${p.labels?.[0] ?? p.name.split(' + ')[0]}</div>
           <div class="pair-block" style="background:${p.stops[1]};color:${p.stops[0]};">${p.labels?.[1] ?? p.name.split(' + ')[1]}</div>
         </div>`
      : `<div class="swatch" style="background:${css}"></div>`;
    const tr = document.createElement('tr');

    const dotsHtml = p.stops.map(s =>
      `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:6px">
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s};border:0.5px solid var(--border);flex-shrink:0"></span>${s}
      </span>`
    ).join('<span style="color:var(--text-muted);font-size:10px">→</span>');

    tr.innerHTML = `
      <td>${previewHtml}</td>
      <td><div class="name">${p.name}</div><div class="vibe">${p.vibe}</div></td>
      <td><div class="hexes">${dotsHtml}</div></td>
      <td style="font-size:11px;font-family:var(--font-mono);color:var(--text-muted)">${p.dir}</td>
      <td></td>`;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(`background: ${css};`);
      btn.textContent = 'Done!';
      setTimeout(() => btn.textContent = 'Copy', 1800);
    };
    tr.cells[4].appendChild(btn);
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
